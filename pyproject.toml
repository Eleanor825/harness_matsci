[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-matsci"
version = "0.1.0"
description = "Runtime uncertainty harness for scientific action decisions in materials discovery."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "harness-matsci contributors" }]
dependencies = []

[project.scripts]
harness-matsci = "harness_matsci.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

